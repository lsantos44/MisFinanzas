name = "finanzas"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Disparador programado: cada 3 horas el Worker baja los movimientos del banco y los deja en
# la bandeja, aunque no abras la app. Es lo que permite la sincronizacion en segundo plano,
# que el navegador no puede hacer con la pestana cerrada.
[triggers]
crons = ["0 */3 * * *"]

# Declarar aquí la base de datos es lo que permite que el botón de despliegue la cree y la
# vincule solo. Quien instale esto no tiene que entrar al panel a añadir el binding a mano,
# que es justo el paso donde se atasca todo el mundo.
[[d1_databases]]
binding = "DB"
database_name = "finanzas"
database_id = ""

[vars]
# La URL de la app. Admite varias separadas por comas.
ALLOW_ORIGIN = "https://misfinanzas.cc"
# Proveedor de IA por defecto (solo si usas el proxy; cada usuario puede poner su clave en la app).
UPSTREAM_BASE = "https://openrouter.ai/api/v1"

# Los secretos NO van aquí: se ponen con `wrangler secret put` o en el panel.
#   PROXY_TOKEN     tu contraseña para que solo tú uses este Worker
#   EB_APP_ID       Application ID de Enable Banking
#   EB_PRIVATE_KEY  contenido del .pem, con las líneas BEGIN/END
#   UPSTREAM_KEY    clave del proveedor de IA (opcional)
